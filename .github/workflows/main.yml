name: CI/CD VisitPilot
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
        - android
        - ios
        - all

jobs:
  check_changes:
    name: Check for Native Changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'mobile_app/android/**'
              - 'mobile_app/ios/**'
              - 'mobile_app/app.json'
              - 'mobile_app/package.json'
              - 'mobile_app/package-lock.json'

  update:
    name: Expo OTA Update (JS/UI)
    needs: check_changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: mobile_app/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          cd mobile_app
          npm install --frozen-lockfile || npm install

      - name: Link and Publish Update
        run: |
          cd mobile_app
          # This forces the 'preview' channel to point to the 'preview' branch
          npx eas-cli channel:edit preview --branch preview --non-interactive || npx eas-cli channel:create preview --branch preview --non-interactive
          npx eas-cli update --branch preview --message "CI/CD: Explicit Link" --non-interactive

  build:
    name: Full App Build (APK/IPA)
    needs: check_changes
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'push' && needs.check_changes.outputs.native == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: mobile_app/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          cd mobile_app
          npm install --frozen-lockfile || npm install

      - name: Build App
        run: |
          cd mobile_app
          # Default to android if it's a push event, otherwise use the input
          PLATFORM=${{ github.event.inputs.platform || 'android' }}
          eas build --platform $PLATFORM --profile preview --non-interactive
