name: CI/CD VisitPilot
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
        - android
        - ios
        - all

jobs:
  update:
    name: Expo OTA Update (No Re-install)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: mobile_app/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          cd mobile_app
          npm install --frozen-lockfile || npm install

      - name: Publish Update (OTA)
        run: |
          cd mobile_app
          # Using --no-install to prevent EAS from trying to run yarn automatically
          eas update --auto --non-interactive --branch production

  build_android:
    name: Build Android APK (Local on GH)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: mobile_app/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd mobile_app
          npm install
          npx expo prebuild --platform android --clean
          eas build --platform android --profile preview --local --non-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisitPilot-Android-APK
          path: mobile_app/*.apk

  build_ios:
    name: Build iOS IPA (Local on GH Mac)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: mobile_app/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          cd mobile_app
          npm install

      - name: Build IPA
        run: |
          cd mobile_app
          eas build --platform ios --profile preview --local --non-interactive

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VisitPilot-iOS-IPA
          path: mobile_app/*.ipa

